[project]
name = "axion-wizard"
# A single definition, in `axion_wizard.__init__`. It used to be written here
# and there at the same time, with nothing to stop the two drifting apart:
# `--version` would have gone on saying one thing while the package published
# another.
dynamic = ["version"]
description = "Installer/orchestrator for the AXION stack (Mattermost + WireGuard + Ollama + FastAPI on Docker)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Garc2004" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "questionary>=2.0",
    "httpx>=0.28",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "cryptography>=44.0",
    "psutil>=6.1",
    "platformdirs>=4.3",
    "tenacity>=9.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "segno>=1.6",
    # Optional full-screen interface (`install --tui`). The spec's §1.3 rules
    # Textual out for the linear flow, and that decision stands: the default
    # path is still questionary. This is an additive alternative, explicitly
    # asked for, not a replacement.
    "textual>=1.0",
]

[project.scripts]
axion-wizard = "axion_wizard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    # The pytest plugin for the TUI's async tests comes from `anyio` itself
    # (`anyio.pytest_plugin`). It is declared here because the tests depend on
    # it, even though httpx already pulls it in transitively.
    # Careful: there is a `pytest-anyio` package on PyPI published at 0.0.0 that
    # is not this and does nothing — do not install it.
    "anyio>=4.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyinstaller>=6.11",
    # The FastAPI bridge (`templates/fastapi/main.py`) is code we ship that
    # only runs inside the container, so it is not a dependency of the wizard —
    # but it is one of its tests: without this, nothing would cover its logic
    # (token validation, async mode, Ollama error handling).
    # Starlette requires `python-multipart` to parse the form-urlencoded body
    # Mattermost's outgoing webhook sends.
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/axion_wizard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axion_wizard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/axion_wizard"]
